[project]
name = "computer-use-automation-system"
version = "0.1.0"
description = "Discover UI workflows, record capabilities, and replay without a model"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "playwright>=1.51,<2",
  "pydantic>=2.10,<3", "typer>=0.15,<1", "openai>=2,<3",
]

[project.scripts]
cua = "cua.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua", "test_environment"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires installed Chromium", "live: requires model credentials"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

